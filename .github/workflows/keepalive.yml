name: Supabase wakker houden

# Gratis Supabase-projecten worden gepauzeerd na een week zonder activiteit.
# Dit doet elke 3 dagen een kleine (afgeschermde) aanvraag zodat de app altijd werkt.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          if echo "$URL" | grep -q "JOUW"; then echo "Nog niet gekoppeld."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/triageve_messages?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          [ "$code" -lt 500 ]

  purge:
    runs-on: ubuntu-latest
    env:
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Prullenbak ouder dan 30 dagen leegmaken
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          if echo "$URL" | grep -q "JOUW"; then echo "Nog niet gekoppeld."; exit 0; fi
          if [ -z "$SERVICE_KEY" ]; then echo "Geen service key; purge overgeslagen."; exit 0; fi
          since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for t in triageve_diary triageve_meetings triageve_contacts triageve_medications triageve_tasks; do
            curl -s -X DELETE "$URL/rest/v1/$t?deleted_at=lt.$since" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY"
            echo " purged $t"
          done
