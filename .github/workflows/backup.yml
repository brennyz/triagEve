name: Versleutelde back-up

# Wekelijkse data-back-up van alleen de triageve_-tabellen.
# Het bestand is versleuteld; de repo is openbaar, dus nooit platte tekst uploaden.
# BACKUP_PASSPHRASE is een GitHub secret die Bren zelf bewaart.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Controleer secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Back-up overgeslagen: secrets ontbreken. Zie SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Dump en versleutel
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db dump --data-only --schema public -f dump.sql
          python3 scripts/filter-triageve-dump.py dump.sql triageve.sql
          gpg --symmetric --batch --yes --passphrase "$BACKUP_PASSPHRASE" --cipher-algo AES256 -o triageve.sql.gpg triageve.sql
          rm -f dump.sql triageve.sql
          test -s triageve.sql.gpg

      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: triageve-backup
          path: triageve.sql.gpg
          retention-days: 90
