name: Versleutelde database-back-up

# Wekelijks een data-only dump van triageve_* , versleuteld met GPG.
# Secret: BACKUP_PASSPHRASE (Bren bewaart hem zelf in een wachtwoordmanager).

on:
  schedule:
    - cron: '12 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Controleer secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Secrets ontbreken (o.a. BACKUP_PASSPHRASE). Back-up overgeslagen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest
      - name: Dump en versleutelen
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          DBURL=$(python3 scripts/pooler-url.py)
          echo "::add-mask::$DBURL"
          supabase db dump --data-only --schema public -f dump.sql --db-url "$DBURL"
          grep -E '^COPY public\.triageve_|^COPY public\.triageve_|CREATE TABLE public\.triageve_|ALTER TABLE public\.triageve_|COPY public.triageve' dump.sql >/dev/null || true
          # Houd alleen triageve_* copy-blokken
          awk '
            /^COPY public\.triageve_/ {keep=1}
            keep {print}
            keep && /^\\\.$/ {keep=0}
          ' dump.sql > triageve-data.sql
          gpg --symmetric --batch --yes --passphrase "$BACKUP_PASSPHRASE" --cipher-algo AES256 -o triageve-backup.sql.gpg triageve-data.sql
          rm -f dump.sql triageve-data.sql
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: triageve-backup
          path: triageve-backup.sql.gpg
          retention-days: 90
