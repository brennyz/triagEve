name: Supabase database

# Voert alle migraties in supabase/migrations automatisch uit, maakt het team-account aan
# (als het nog niet bestaat) en test dat niemand zonder inlog bij de gegevens kan.
# Benodigde repository secrets (eenmalig, via scripts/setup.ps1):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF,
#   SUPABASE_SERVICE_ROLE_KEY, TRIAGEVE_JACKY_PASSWORD, TRIAGEVE_PAPS_PASSWORD,
#   TRIAGEVE_BREN_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase.yml'
      - 'config.js'
  workflow_dispatch:

concurrency:
  group: supabase-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JACKY_PASSWORD: ${{ secrets.TRIAGEVE_JACKY_PASSWORD }}
      PAPS_PASSWORD: ${{ secrets.TRIAGEVE_PAPS_PASSWORD }}
      BREN_PASSWORD: ${{ secrets.TRIAGEVE_BREN_PASSWORD }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Controleer secrets
        id: secrets
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SERVICE_KEY JACKY_PASSWORD PAPS_PASSWORD BREN_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ontbreken:$missing. Draai scripts/set-github-secrets.ps1. Migraties overgeslagen."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ok == 'true'
        with:
          version: latest

      - name: Migraties uitvoeren
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push --include-all

      - name: Accounts van Jacky, Paps en Bren aanmaken
        if: steps.secrets.outputs.ok == 'true'
        run: |
          create_account() {
            local name="$1" email="$2" pass="$3"
            body=$(jq -n --arg e "$email" --arg p "$pass" --arg n "$name" \
              '{email:$e, password:$p, email_confirm:true, user_metadata:{name:$n}}')
            code=$(curl -s -o resp.json -w '%{http_code}' -X POST \
              "https://$PROJECT_REF.supabase.co/auth/v1/admin/users" \
              -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "Account $name aangemaakt."
            elif grep -qiE "already|exists|registered" resp.json; then
              echo "Account $name bestond al. Wachtwoord niet gewijzigd."
            else
              echo "::error::Account $name aanmaken mislukt (HTTP $code)"
              jq -c 'del(.password)' resp.json 2>/dev/null || true
              exit 1
            fi
            rm -f resp.json
          }
          python3 - << 'PY' > /tmp/triageve-accounts.txt
          import re
          text = open("config.js", encoding="utf-8").read()
          block = re.search(r"ACCOUNTS:\s*\{([^}]+)\}", text)
          if not block:
              raise SystemExit("ACCOUNTS ontbreekt in config.js")
          pairs = re.findall(r"(Jacky|Paps|Bren):\s*'([^']+)'", block.group(1))
          if len(pairs) != 3:
              raise SystemExit("config.js moet Jacky, Paps en Bren bevatten")
          for name, email in pairs:
              print(f"{name} {email}")
          PY
          while read -r name email; do
            case "$name" in
              Jacky) pass="$JACKY_PASSWORD" ;;
              Paps) pass="$PAPS_PASSWORD" ;;
              Bren) pass="$BREN_PASSWORD" ;;
              *) echo "::error::Onbekende naam $name"; exit 1 ;;
            esac
            create_account "$name" "$email" "$pass"
          done < /tmp/triageve-accounts.txt
          rm -f /tmp/triageve-accounts.txt

      - name: Beveiligingstest (zonder inlog mag je niets zien)
        if: steps.secrets.outputs.ok == 'true'
        run: |
          URL="https://$PROJECT_REF.supabase.co/rest/v1"
          ANON=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          if [ -z "$ANON" ] || echo "$ANON" | grep -q "JOUW"; then
            echo "::warning::config.js heeft nog geen publishable key; beveiligingstest overgeslagen."; exit 0
          fi
          # Een testbericht plaatsen met de service key, dan proberen te lezen zonder inlog.
          id=$(curl -s -X POST "$URL/triageve_messages" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d '{"author":"CI","body":"[TEST] beveiligingstest"}' | jq -r '.[0].id')
          fail=0
          for t in $(ls supabase/migrations/*.sql | xargs grep -ohP "create table if not exists public\.\K\w+" | sort -u); do
            out=$(curl -s "$URL/$t?select=*&limit=1" -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
            if echo "$out" | jq -e 'type == "array" and length > 0' > /dev/null 2>&1; then
              echo "::error::LEK: $t is leesbaar zonder inlog!"; fail=1
            else
              echo "OK: $t afgeschermd"
            fi
          done
          curl -s -X DELETE "$URL/triageve_messages?id=eq.$id" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" > /dev/null
          exit $fail

      - name: Edge function notify + VAPID-secret
        if: steps.secrets.outputs.ok == 'true'
        run: |
          supabase functions deploy notify --project-ref "$PROJECT_REF" || echo "::warning::Function deploy mislukt (kan wachten tot fase 12 secrets er zijn)."
          PUB=$(grep -oP "VAPID_PUBLIC_KEY:\s*'\K[^']+" config.js || true)
          if [ -n "$VAPID_PRIVATE_KEY" ] && [ -n "$PUB" ]; then
            supabase secrets set "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY" "VAPID_PUBLIC_KEY=$PUB" --project-ref "$PROJECT_REF"
          else
            echo "::warning::VAPID_PRIVATE_KEY of publieke sleutel ontbreekt; push wacht op Bren."
          fi
